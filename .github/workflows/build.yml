name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Android SDK 37.2
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          install() {
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            yes | "$SM" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
          }
          if ! install; then
            echo "::warning::preinstalled sdkmanager failed, downloading latest cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
            rm -rf /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
            mkdir -p /tmp/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            install
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            testDebugUnitTest assembleDebug

      - name: Build release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          set -e
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            assembleRelease

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yizhong-bang-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: yizhong-bang-release
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: warn
